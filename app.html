<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUIZfy</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="app.css">
</head>
<body>

    <main id="app-container">

        <section id="vista-auth" class="auth-wrapper">
            <div class="auth-card">
                
                <div class="auth-tabs">
                    <button id="btn-tab-login" class="tab-btn active" onclick="mostrarTabAuth('login')">Iniciar Sesión</button>
                    <button id="btn-tab-registro" class="tab-btn" onclick="mostrarTabAuth('registro')">Registrarse</button>
                </div>

                <form id="form-login" class="auth-form" onsubmit="iniciarSesion(event)">
                    <h2>¡Bienvenido a QUIZfy!</h2>
                    <p class="auth-subtitle">Ingresa para jugar y personalizar tu avatar</p>

                    <div class="input-group">
                        <label for="login-usuario">Usuario o Correo</label>
                        <input type="text" id="login-usuario" required placeholder="Ej. juan123 o juan@gmail.com">
                    </div>

                    <div class="input-group">
                        <label for="login-password">Contraseña</label>
                        <input type="password" id="login-password" required placeholder="••••••••">
                    </div>

                    <button type="submit" class="btn-primary">Entrar a Jugar</button>
                </form>

                <form id="form-registro" class="auth-form d-none" onsubmit="registrarUsuario(event)">
                    <h2>Crear Cuenta</h2>
                    <p class="auth-subtitle">¡Recibe 100 monedas de regalo al registrarte!</p>

                    <div class="input-group">
                        <label for="reg-usuario">Nombre de Usuario</label>
                        <input type="text" id="reg-usuario" required placeholder="Ej. GamerPro">
                    </div>

                    <div class="input-group">
                        <label for="reg-correo">Correo Electrónico</label>
                        <input type="email" id="reg-correo" required placeholder="tu@correo.com">
                    </div>

                    <div class="input-group">
                        <label for="reg-password">Contraseña</label>
                        <input type="password" id="reg-password" required placeholder="Mínimo 6 caracteres">
                    </div>

                    <button type="submit" class="btn-primary">Registrarme</button>
                </form>

            </div>
        </section>

        <section id="vista-dashboard" class="dashboard-wrapper d-none">
            
            <header class="lobby-header">
                
                <div class="lobby-left">
                    <button class="btn-lobby-outline" onclick="abrirPerfil()">
                        👤 <span id="btn-nombre-usuario">Perfil</span>
                    </button>
                    <button class="btn-lobby-outline btn-tienda" onclick="abrirTienda()">
                        Tienda
                    </button>
                </div>

                <div class="lobby-center">
                    <div class="mensaje-sistema">
                        <p id="lbl-mensaje-aleatorio">¡Bienvenido! Tienes <strong id="lbl-monedas">0</strong> monedas.</p>
                    </div>
                </div>

                <div class="lobby-right">
                    <button onclick="cerrarSesion()" class="btn-lobby-outline btn-logout">
                        Sign out
                    </button>
                </div>
            </header>

            <div class="lobby-stage">
                <div class="avatar-display">
                    <span>AVATAR</span>
                </div>
                <h2 id="lbl-nombre-usuario" class="player-name">Jugador</h2>
            </div>

            <div class="lobby-bottom-right">
                <button class="btn-jugar-gigante" onclick="abrirSeleccionQuiz()">
                    ¡Empezar a Jugar!
                </button>
            </div>

        </section>

        <section id="vista-tienda" class="avatar-editor d-none">
            
            <!-- 🔝 Sección Superior: Controles y Preview del Avatar -->
            <div class="editor-top-section">
                
                <!-- Columna Izquierda: Botón Volver + Avatar Cuadrado -->
                <div class="editor-top-left">
                    <button class="btn-outline-excalidraw" onclick="cerrarTienda()" title="Volver">←</button>
                    
                    <div class="avatar-preview-square" id="canvas-avatar">
                        <span>AVATAR PREVIEW</span>
                    </div>
                </div>

                <!-- Columna Central: Nombre de usuario -->
                <div class="editor-top-center">
                    <span id="editor-nombre-usuario" class="username-badge">Nombre de Usuario</span>
                </div>

                <!-- Columna Derecha: Guardar -->
                <div class="editor-top-right">
                    <button class="btn-outline-excalidraw btn-guardar" onclick="guardarCambiosAvatar()">Guardar cambios</button>
                </div>

            </div>

            <!-- Pestañas y Acción Rápida -->
            <div class="editor-controls">
                <div class="tabs">
                    <button class="tab-btn tab-tienda active" onclick="cambiarPestanaTienda(event, 'cabeza')">cabeza</button>
                    <button class="tab-btn tab-tienda" onclick="cambiarPestanaTienda(event, 'ropa')">ropa</button>
                    <button class="tab-btn tab-tienda" onclick="cambiarPestanaTienda(event, 'accesorios')">accesorios</button>
                    <button class="tab-btn tab-tienda" onclick="cambiarPestanaTienda(event, 'marco')">marco</button>
                </div>
                <button class="btn-reset" onclick="quitarTodo()">Quitar todo</button>
            </div>

            <!-- Contenedor del Inventario/Tienda (La caja inferior grande) -->
            <div class="items-grid-container">
                <div id="grid-inventario" class="items-grid">
                    <!-- Los items se inyectarán aquí por JavaScript -->
                    <p style="color: #666; text-align: center; grid-column: 1 / -1;">Cargando ítems...</p>
                </div>
            </div>

        </section>


    </main>

    <script src="app.js"></script>
</body>
</html>
